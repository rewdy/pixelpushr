services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pixelpushr
      POSTGRES_USER: pixelpushr
      POSTGRES_PASSWORD: pixelpushr
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelpushr -d pixelpushr"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  floci:
    image: floci/floci:latest
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_UI_ENABLED: "false"
    volumes:
      - floci_data:/app/data

volumes:
  postgres_data:
  floci_data:
